<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniFut</title>
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="hub.css">
</head>
<body>

<div class="topbar">
  <button class="menu-btn" id="btnMenu" aria-expanded="false" aria-controls="drawer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span>Times</span><span class="cont" id="contBtn"></span>
  </button>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-label="Lista de times" inert>
  <div class="drawer-head">
    <h2>Times em ordem alfabética</h2>
    <span class="qtd" id="qtd"></span>
    <button class="fechar" id="btnFecharMenu" aria-label="Fechar menu">×</button>
  </div>
  <input class="busca" id="busca" type="search" placeholder="Buscar por nome, estado ou país" aria-label="Buscar time" autocomplete="off">
  <div class="lista" id="lista"></div>
</aside>

<main class="hero">
  <img id="logo" alt="Logo do OmniFut">
  <h1>OmniFut</h1>
  <p class="lead">Hub de ideias e simulações de futebol.</p>
  <p class="stats" id="stats">Carregando base de times…</p>
  <div class="opcoes">
    <a class="opcao" id="linkCampeonato" href="campeonato/">
      <span class="op-tit">Criar campeonato</span>
      <span class="op-desc">Faça um campeonato de pontos corridos com suas regras e times!</span>
      <span class="op-status" id="statusCampeonato"></span>
      <span class="seta" aria-hidden="true">→</span>
    </a>
    <a class="opcao" id="linkCopa" href="copa/">
      <span class="op-tit">Criar copa</span>
      <span class="op-desc">Faça uma copa com suas regras, times e vários modos de visualização!</span>
      <span class="op-status" id="statusCopa"></span>
      <span class="seta" aria-hidden="true">→</span>
    </a>
  </div>
  <button class="cta discreto" id="btnAbrir" disabled>Ver lista de times</button>
</main>

<dialog id="modal" aria-labelledby="mNome">
  <div class="card" id="card"></div>
</dialog>

<dialog id="visualizador" aria-label="Imagem ampliada">
  <figure><img id="vImg" alt=""><figcaption id="vLeg"></figcaption></figure>
</dialog>

<script src="core/hub-data.js"></script>
<script>
const ESTADOS = {
  AC:"Acre", AL:"Alagoas", AP:"Amapá", AM:"Amazonas", BA:"Bahia", CE:"Ceará", DF:"Distrito Federal",
  ES:"Espírito Santo", GO:"Goiás", MA:"Maranhão", MT:"Mato Grosso", MS:"Mato Grosso do Sul",
  MG:"Minas Gerais", PA:"Pará", PB:"Paraíba", PR:"Paraná", PE:"Pernambuco", PI:"Piauí",
  RJ:"Rio de Janeiro", RN:"Rio Grande do Norte", RS:"Rio Grande do Sul", RO:"Rondônia",
  RR:"Roraima", SC:"Santa Catarina", SP:"São Paulo", SE:"Sergipe", TO:"Tocantins", AGBA:"Buenos Aires", 
  AGCB:"Córdoba", AGSF:"Santa Fe", BOCB:"Cochabamba", BOLP:"La Paz", BOOR:"Oruro", BOPT:"Potosí", 
  BOSC:"Santa Cruz", CACY:"Cayenne", CASL:"Saint-Laurent du Maroni", COAN:"Antioquia", COAT:"Atlántico", 
  COCA:"Caquetá", CODC:"Distrito Capital", COVA:"Valle del Cauca", ECAZ:"Azuay", ECGY:"Guayas", ECPI:"Pichincha", 
  GYDE:"Demerara-Mahaica", GYEB:"East Berbice-Corentyne", PEAR:"Arequipa", PECU:"Cusco", PELA:"La Libertad", 
  PELI:"Lima", PYAS:"Asunción", PYCA:"Central", SRPA:"Paramaribo", SRWA:"Wanica", VEBA:"Barinas", VECA:"Carabobo", 
  VEDC:"Distrito Capital", VEME:"Mérida", VEMI:"Miranda", VETA:"Táchira", VEZU:"Zulia", CLAN:"Antofagasta", CLBI:"Biobío", CLRM:"Região Metropolitana", CLVA:"Valparaíso", UYMO:"Montevidéu"
};
const REGIOES = { norte:"Norte", nordeste:"Nordeste", centro_oeste:"Centro-Oeste", sudeste:"Sudeste", sul:"Sul", Argentina:"Argentina" };

const $ = id => document.getElementById(id);
// Logo: GitHub Pages diferencia maiúsculas, então tenta logo.png e Logo.png; sem nenhum, esconde a imagem
(function logo() {
  const img = $("logo"), alvos = ["logo.png", "Logo.png"]; let n = 0;
  img.onerror = () => { if (++n < alvos.length) img.src = alvos[n]; else img.remove(); };
  img.src = alvos[0];
})();
let times = [];

// ---------- Detalhes (times-detalhe.json): carregados só na primeira vez que alguém abre um time ----------
let detalhesPromessa = null;
function carregarDetalhes() {
  if (!detalhesPromessa) {
    detalhesPromessa = fetch("times-detalhe.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => d.times || {})
      .catch(() => { detalhesPromessa = null; return {}; });   // falhou: mostra o básico e tenta de novo no próximo clique
  }
  return detalhesPromessa;
}

// ---------- Utilidades ----------
function el(tag, cls, texto) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texto != null) e.textContent = texto;
  return e;
}
function semAcento(s) {
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
function imagem(src, alt, aoFalhar) {
  const i = new Image();
  i.alt = alt || "";
  i.onerror = () => aoFalhar ? aoFalhar(i) : i.remove();
  i.src = src;
  return i;
}
// Tenta cada endereço da lista até um carregar (para nomes de arquivo com mais de uma grafia)
function imagemTentando(lista, alt, aoFalhar) {
  const i = new Image();
  let n = 0;
  i.alt = alt || "";
  i.onerror = () => {
    n++;
    if (n < lista.length) i.src = lista[n];
    else if (aoFalhar) aoFalhar(i); else i.remove();
  };
  i.src = lista[0];
  return i;
}
// Bandeira do estado (bandeiras/UF.png); sem a imagem, mostra a sigla da UF
function bandeira(t, classe) {
  const estado = ESTADOS[t.uf] || t.uf;
  // brasileiros: bandeiras/UF.png; estrangeiros: província, depois país (2 primeiras letras do código) e a sigla da federação
  const nomes = t.uf.length === 2 ? [t.uf] : [t.uf, t.uf.slice(0, 2), (t.federacao || {}).sigla];
  const i = imagemTentando(nomes.filter(Boolean).map(n => `bandeiras/${n}.png`), "Bandeira de " + estado,
    img => img.replaceWith(el("span", "uf-tag", t.uf)));
  i.className = classe;
  i.title = estado;
  return i;
}
// Cor predominante da imagem em hexadecimal (null se o navegador bloquear a leitura dos pixels)
function hexDominante(img) {
  try {
    const lado = 32;
    const c = document.createElement("canvas");
    c.width = c.height = lado;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, lado, lado);
    const px = ctx.getImageData(0, 0, lado, lado).data;
    const grupos = new Map();
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] < 128) continue;                         // ignora transparência
      const k = ((px[i] >> 4) << 8) | ((px[i + 1] >> 4) << 4) | (px[i + 2] >> 4);
      const g = grupos.get(k) || { n: 0, r: 0, g: 0, b: 0 };
      g.n++; g.r += px[i]; g.g += px[i + 1]; g.b += px[i + 2];
      grupos.set(k, g);
    }
    let melhor = null;
    grupos.forEach(g => { if (!melhor || g.n > melhor.n) melhor = g; });
    if (!melhor) return null;
    return "#" + [melhor.r, melhor.g, melhor.b]
      .map(v => Math.round(v / melhor.n).toString(16).padStart(2, "0")).join("").toUpperCase();
  } catch (e) { return null; }
}

function badge(t, tamanho, comoBotao) {
  const b = el(comoBotao ? "button" : "div", "badge " + tamanho);
  if (comoBotao) b.type = "button";
  const sigla = () => b.replaceChildren(el("span", "sigla", t.sigla || t.nome.charAt(0)));
  if (t.escudo) b.append(imagem(t.escudo, "Escudo do " + t.nome, sigla)); else sigla();
  return b;
}
function nomeDaCor(caminho) {
  const base = caminho.split("/").pop().replace(/\.[a-z]+$/i, "");
  return base.charAt(0).toUpperCase() + base.slice(1);
}

// ---------- Carregar a base ----------
async function carregar() {
  try {
    const r = await fetch("times.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const dados = await r.json();
    const lista = Array.isArray(dados) ? dados : dados.times;
    if (!Array.isArray(lista)) throw new Error("formato");
    times = lista.slice().sort((a, b) =>
      a.nome.localeCompare(b.nome, "pt-BR", { sensitivity: "base" }) || a.uf.localeCompare(b.uf));
    const estados = new Set(times.map(t => t.uf)).size, paises = new Set(times.map(t => t.pais).filter(Boolean)).size;
    $("stats").textContent = paises > 1 ? `${times.length} times em ${paises} países`
      : `${times.length} times em ${estados} ${estados === 1 ? "estado" : "estados"}`;
    $("contBtn").textContent = times.length;
    $("btnAbrir").disabled = false;
    desenharLista();
  } catch (e) {
    const s = $("stats");
    s.className = "stats erro";
    s.textContent = "Não consegui carregar o times.json. Se você abriu o arquivo direto do computador, use um servidor local (python -m http.server) ou publique no GitHub Pages.";
  }
}

// ---------- Menu lateral ----------
function abrirMenu() {
  $("drawer").inert = false;
  $("drawer").classList.add("open");
  $("scrim").classList.add("open");
  $("btnMenu").setAttribute("aria-expanded", "true");
  $("busca").focus();
}
function fecharMenu() {
  $("drawer").classList.remove("open");
  $("scrim").classList.remove("open");
  $("drawer").inert = true;
  $("btnMenu").setAttribute("aria-expanded", "false");
  $("btnMenu").focus();
}

function desenharLista() {
  const termo = semAcento($("busca").value.trim());
  const filtrados = times.filter(t => !termo ||
    semAcento([t.nome, t.uf, ESTADOS[t.uf], t.pais, t.sigla].join(" ")).includes(termo));
  const lista = $("lista");
  lista.replaceChildren();
  $("qtd").textContent = termo ? `${filtrados.length} de ${times.length}` : `${times.length}`;

  if (!filtrados.length) {
    lista.append(el("div", "nada", "Nenhum time encontrado."));
    return;
  }
  let letraAtual = "";
  filtrados.forEach(t => {
    const letra = semAcento(t.nome).charAt(0).toUpperCase();
    if (letra !== letraAtual) { letraAtual = letra; lista.append(el("div", "letra", letra)); }
    const b = el("button", "item");
    b.type = "button";
    const txt = el("span", "txt");
    txt.append(el("span", "nome", t.nome), el("span", "sub", t.cidade || ESTADOS[t.uf] || ""));
    b.append(badge(t, "sm"), txt, bandeira(t, "bandeira-sm"));
    b.onclick = () => abrirTime(t);
    lista.append(b);
  });
}

// ---------- Janela do time ----------
function caixaImagem(titulo, src, legenda, rodape) {
  const box = el("div", "kit");
  box.append(el("span", "kit-t", titulo));
  const b = el("button", "kit-img");
  b.type = "button";
  const vazio = () => { b.disabled = true; b.removeAttribute("aria-label"); b.replaceChildren(el("span", "kit-vazio", "Sem foto")); };
  if (!src) vazio();
  else {
    b.setAttribute("aria-label", "Ampliar: " + titulo);
    b.append(imagem(src, titulo, vazio));
    b.onclick = () => abrirVisualizador(src, legenda);
  }
  box.append(b);
  if (rodape) box.append(el("span", "kit-n", rodape));
  return box;
}

function linhaInfo(dl, rotulo, valor) {
  if (valor == null || valor === "") return;
  const d = el("div");
  d.append(el("dt", null, rotulo), el("dd", null, String(valor)));
  dl.append(d);
}

async function abrirTime(leve) {
  const det = await carregarDetalhes();
  const t = { ...leve, ...(det[leve.id] || {}) };      // leve + detalhe (cidade, cores, mascote, uniformes, federação, fundação)
  const card = $("card");
  card.replaceChildren();

  const fechar = el("button", "fechar", "×");
  fechar.type = "button";
  fechar.setAttribute("aria-label", "Fechar");
  fechar.onclick = () => $("modal").close();

  const escudo = badge(t, "lg", true);
  if (t.escudo) escudo.onclick = () => abrirVisualizador(t.escudo, "Escudo do " + t.nome);
  const titulo = el("h3", null, t.nome);
  titulo.id = "mNome";
  const local = el("p", "local", [t.cidade, t.uf].filter(Boolean).join(" · "));
  // Bandeira do estado e símbolo da região, entre o escudo e o texto
  const selos = el("div", "selos");
  selos.append(bandeira(t, "bandeira"));
  if (t.regiao) {
    const rotulo = "Região " + (REGIOES[t.regiao] || t.regiao);
    const arquivos = [...new Set([t.regiao.replace(/_/g, "-"), t.regiao])].map(r => `regiao/${r}.png`);
    const simbolo = imagemTentando(arquivos, rotulo);
    simbolo.title = rotulo;
    selos.append(simbolo);
  }
  card.append(fechar, escudo, selos, titulo, local);

  // Dados gerais
  const sec1 = el("div", "sec");
  sec1.append(el("h4", null, "Informações"));
  const dl = el("dl", "info");
  linhaInfo(dl, "Sigla", t.sigla);
  linhaInfo(dl, "Cidade", t.cidade);
  linhaInfo(dl, "Estado", `${ESTADOS[t.uf] || t.uf} (${t.uf})`);
  linhaInfo(dl, "Região", REGIOES[t.regiao] || t.regiao);
  linhaInfo(dl, "Fundação", t.fundacao);
  linhaInfo(dl, "Série", t.serie ? "Série " + t.serie : null);
  sec1.append(dl);
  card.append(sec1);

  // Federação
  const fed = (t.federacao && typeof t.federacao === "object") ? t.federacao : {};
  if (fed.sigla || fed.imagem) {
    const sec = el("div", "sec");
    sec.append(el("h4", null, "Federação"));
    const linha = el("div", "fed");
    if (fed.imagem) linha.append(imagemTentando([...new Set([fed.imagem, fed.sigla && `federacao/${fed.sigla}.png`, `federacao/${t.uf.slice(0, 2)}.png`].filter(Boolean))], "Federação " + (fed.sigla || "")));
    if (fed.sigla) linha.append(el("span", null, fed.sigla));
    sec.append(linha);
    card.append(sec);
  }

  // Cores
  const secC = el("div", "sec");
  secC.append(el("h4", null, "Cores"));
  const cores = Array.isArray(t.cores) ? t.cores : [];
  if (cores.length) {
    const caixa = el("div", "cores");
    cores.forEach(c => {
      const chip = el("span", "cor");
      const quadrado = el("span", "cor-q");
      const img = imagem(c, "", () => { quadrado.remove(); chip.classList.add("sem-img"); });
      img.onload = () => {                                   // mostra o hex lido da imagem
        const hex = hexDominante(img);
        if (!hex) return;
        chip.append(el("span", "cor-hex", hex));
        chip.title = nomeDaCor(c) + " " + hex;
      };
      quadrado.append(img);
      chip.append(quadrado, document.createTextNode(nomeDaCor(c)));
      caixa.append(chip);
    });
    secC.append(caixa);
  } else {
    secC.append(el("span", "vazio-txt", "Sem cores marcadas"));
  }
  card.append(secC);

  // Uniformes e mascote
  const u = t.uniformes || {};
  const m = t.mascote || {};
  const secU = el("div", "sec");
  secU.append(el("h4", null, "Uniformes e mascote"));
  const kits = el("div", "kits");
  kits.append(
    caixaImagem("Titular", u.titular, `${t.nome} – uniforme titular`),
    caixaImagem("Reserva", u.reserva, `${t.nome} – uniforme reserva`),
    caixaImagem("Mascote", m.imagem, `${t.nome} – mascote${m.nome ? " (" + m.nome + ")" : ""}`, m.nome)
  );
  secU.append(kits);
  card.append(secU);

  $("modal").showModal();
}

// ---------- Visualizador de imagem ----------
function abrirVisualizador(src, legenda) {
  $("vImg").src = src;
  $("vImg").alt = legenda || "";
  $("vLeg").textContent = legenda || "";
  $("visualizador").showModal();
}

// ---------- Eventos ----------
$("btnMenu").onclick = () => $("drawer").classList.contains("open") ? fecharMenu() : abrirMenu();
$("btnAbrir").onclick = abrirMenu;
$("btnFecharMenu").onclick = fecharMenu;
$("scrim").onclick = fecharMenu;
$("busca").addEventListener("input", desenharLista);
$("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").close(); });
$("visualizador").addEventListener("click", () => $("visualizador").close());
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.querySelector("dialog[open]") && $("drawer").classList.contains("open")) fecharMenu();
});

// ---------- Campeonato e Copa ----------
// Endereços dos projetos, relativos a esta página (ajuste se as pastas tiverem outro nome).
const SITES = { campeonato: "campeonato/", copa: "copa/" };

// Lê o que os outros sites gravaram (contrato em hub-data.js); sem o arquivo, fica sem status.
function lerHub(chave) {
  return (typeof HubData !== "undefined") ? HubData.get(chave) : null;
}
function mostrarOpcoes() {
  const progresso = lerHub("campeonato:progresso");
  const campeaoCamp = lerHub("campeonato:campeao");
  const classificados = lerHub("campeonato:classificados");
  const campeaoCopa = lerHub("copa:campeao");
  const status = {
    Campeonato: campeaoCamp ? [`Campeão dos playoffs: ${campeaoCamp.nome}`, true]
      : progresso ? [`${progresso.concluidas} de ${progresso.total} temporadas concluídas`, false]
      : ["Nenhuma temporada simulada ainda.", false],
    Copa: campeaoCopa ? [`Campeão: ${campeaoCopa.nome}`, true]
      : (classificados && classificados.length) ? [`${classificados.length} vagas diretas definidas pelo campeonato.`, false]
      : ["Sorteio livre: nenhum classificado do campeonato ainda.", false]
  };
  Object.keys(status).forEach(nome => {
    $("link" + nome).href = SITES[nome.toLowerCase()];
    $("status" + nome).textContent = status[nome][0];
    $("status" + nome).classList.toggle("ok", status[nome][1]);
  });
}

mostrarOpcoes();
carregar();
</script>
</body>
</html>
